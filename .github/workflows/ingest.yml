name: Daily paper ingestion

on:
    schedule:
        - cron: "0 6 * * 1-5" #11:30 A.M.
    workflow_dispatch:

jobs:
    ingest:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.2
              with:
                enable-cache: true
            
            - name: Cache Docling models
              uses: actions/cache@v6
              with:
                path: ~/.cache/huggingface
                key: docling-models-v1
            
            - name: Install dependencies
              run: uv sync --frozen --no-dev

            - name: Ingest papers
              run: uv run --no-dev python -m scripts.ingest_papers
              env:
                OPENAI_API_KEY: ${{secrets.OPENAI_API_KEY}}
                PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
                POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
                LANGCHAIN_TRACING_V2: "false"

