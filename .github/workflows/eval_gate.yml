name: Eval gate

# On a PR that changes a query-time setting (config.py / RAG prompt): run the eval, log it to
# MLflow on DagsHub as the challenger, gate it against the champion, then promote or reject.
# Chunking changes aren't supported yet: CI doesn't rebuild Pinecone.

on:
    pull_request:
        paths:
            - src/config.py
            - src/services/openai_/prompts/**
    workflow_dispatch:

# The steps below change shared MLflow stage tags, so never let two runs overlap.
concurrency:
    group: eval-gate
    cancel-in-progress: false

jobs:
    eval-gate:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
            PYTHONUNBUFFERED: "1"
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.3.2
              with:
                enable-cache: true

            - name: Install dependencies (incl. dev, for pytest)
              run: uv sync --frozen

            - name: Run experiment (new challenger on DagsHub)
              run: uv run python -m evals.evaluate_rag_app
              env:
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
                LANGCHAIN_TRACING_V2: "false"
                DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

            - name: Gate (regression + promotion tests)
              id: gate
              continue-on-error: true
              run: uv run pytest tests/ -v

            - name: Promote challenger
              if: steps.gate.outcome == 'success'
              run: uv run python -m scripts.promote promote

            - name: Reject challenger
              if: steps.gate.outcome == 'failure'
              run: |
                uv run python -m scripts.promote reject
                exit 1
