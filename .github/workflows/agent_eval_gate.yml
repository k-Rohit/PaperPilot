name: Agent eval gate

# On a PR that changes the agent (nodes, prompts, graph config) or config.py: run the agent eval,
# log it to MLflow on DagsHub (experiment paperpilot-agent) as the challenger, gate it against
# the champion, then promote or reject.

on:
    pull_request:
        paths:
            - src/services/agents/**
            - src/config.py
    workflow_dispatch:

# The steps below change shared MLflow stage tags, so never let two runs overlap.
concurrency:
    group: agent-eval-gate
    cancel-in-progress: false

jobs:
    agent-eval-gate:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
            PYTHONUNBUFFERED: "1"
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.3.2
              with:
                enable-cache: true

            - name: Install dependencies (incl. dev, for pytest)
              run: uv sync --frozen

            - name: Run agent experiment (new challenger on DagsHub)
              run: uv run python -m evals.evaluate_agent
              env:
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
                POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
                LANGCHAIN_TRACING_V2: "false"
                DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

            - name: Agent regression and promotion tests
              id: gate
              continue-on-error: true
              run: uv run pytest tests/gate/agent -v

            - name: Promote challenger
              if: steps.gate.outcome == 'success'
              run: uv run python -m scripts.promote promote agent

            - name: Reject challenger
              if: steps.gate.outcome == 'failure'
              run: |
                uv run python -m scripts.promote reject agent
                exit 1
