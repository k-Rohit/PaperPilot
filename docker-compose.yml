# Postgres is hosted on Supabase (POSTGRES_DATABASE_URL / CHECKPOINT_DATABASE_URL in .env),
# shared by the local API, the deployed API and the GitHub Actions ingestion job.
services:

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - rag-network

  api:
      build: .
      container_name: rag-api
      ports:
        - "8000:8000"
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      env_file:
        - .env
      environment:
        - REDIS__HOST=redis
      networks:
        - rag-network

volumes:
  redis_data:

networks:
  rag-network:
    driver: bridge



    


