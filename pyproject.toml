[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src","evals"]

[project]
name = "paperpilot"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "uvicorn>=0.34.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13.3",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "docling>=2.43.0",
    "python-dateutil>=2.9.0.post0",
    "sentence-transformers>=5.1.0",
    "gradio>=4.0.0",
    "langfuse>=3.0.0",
    "redis>=6.4.0",
    "python-telegram-bot>=21.0,<22.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.3.0",
    "openai>=1.40.0",
    "langsmith>=0.8.4",
    "langchain-openai>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary]>=3.3.4",
    "pinecone>=10.0.0",
    "pypdfium2>=5.8.0",
]
readme = "README.md"

[dependency-groups]
dev = [
    "anyio[trio]>=4.9.0",
    "asgi-lifespan>=2.1.0",
    "deepeval>=4.3.1",
    "jupyter>=1.1.1",
    "mypy>=1.15.0",
    "notebook>=7.4.4",
    "polyfactory>=2.21.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov>=6.1.1",
    "pytest-dotenv>=0.5.2",
    "pytest-env>=1.1.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.5",
    "testcontainers>=4.10.0",
    "types-sqlalchemy>=1.4.53.38",
]
viz = [
    "grandalf>=0.8",
]

[tool.ruff]
line-length = 130
exclude = ["notebooks/**", ".venv/**"]
src = ["src", "tests"]
lint.select = [
  "I",     # isort — import ordering
  "F",     # Pyflakes — undefined names, unused imports/variables, unreachable code
  "E",     # pycodestyle errors — indentation, syntax-adjacent issues
  "W",     # pycodestyle warnings — whitespace, blank lines
  "B",     # flake8-bugbear — real bug patterns (mutable default args, unused loop vars, etc.)
  "RET",   # flake8-return — missing returns, unnecessary returns, returns inside loops
  "SIM",   # flake8-simplify — code that could be cleaner
  "UP",    # pyupgrade — modern Python syntax
]

# Skip specific noisy or stylistic rules
lint.ignore = [
  "E501",  # line-too-long (handled by `line-length` + formatter)
  "B008",  # function-call-in-default-argument (false-positives for Pydantic Field defaults)
]

# Our own packages — sorted into their own group below third-party imports
lint.isort.known-first-party = ["src", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env_files = ".env.test"

[tool.mypy]
explicit_package_bases = true
ignore_errors = true

